<h2>蛛网魔杖 Wand of Web</h2>
<P><EM>魔杖，非普通（需施法者同调）</EM><BR>这根魔杖具有7充能。持握它时，你可以消耗1充能从中施展<U><I>蛛网术Webs</I></U>（豁免DC13）。<BR><STRONG>重获充能Regaining 
Charges</STRONG>。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P>
