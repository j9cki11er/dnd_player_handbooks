<h2>魔法飞弹魔杖 Wand of Magic Missiles</h2>
<P><EM>魔杖，非普通<BR></EM>这根魔杖具有7充能。当持握它时，你可以消耗最多3充能从中施展<U><I>魔法飞弹Magic 
Missiles</I></U> 
。你可以用1充能施展1环版本的法术。每多消耗1充能，法术的环位就将提升1环。<BR><STRONG>重获充能Regaining 
Charges</STRONG> 
。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P>
