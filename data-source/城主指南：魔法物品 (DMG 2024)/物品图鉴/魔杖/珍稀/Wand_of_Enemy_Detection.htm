<html lang="zh-CN"><head><meta charset="utf-8"><title>搜敌魔杖</title></head><body>
<h2>搜敌魔杖 Wand of Enemy Detection</h2>
<P><EM>魔杖，珍稀（需同调）</EM><BR>这根魔杖具有7充能。持握它时，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1充能。在一分钟内，你可以知道位于你60尺内离你最近的敌对生物所在的方向，但不知道距离。魔杖可以感知肉眼可见的敌对生物，也可以感知到<STRONG><FONT color=#008000>隐形</FONT></STRONG>、以太化、伪装、躲藏的敌对生物。效应在你不再持握这根魔杖时终止。<BR><STRONG>重获充能Regaining 
Charges</STRONG>。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P>
</body></html>
