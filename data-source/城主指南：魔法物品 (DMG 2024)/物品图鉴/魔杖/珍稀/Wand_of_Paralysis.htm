<h2>麻痹魔杖 Wand of Paralysis</h2>
<P><EM>魔杖，珍稀（需施法者同调）<BR></EM>这根魔杖具有7充能。持握它时，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1充能，从魔杖尖端向位于你60尺内的一个你可见的生物射出一发纤细的蓝色光线。目标必须成功通过一次DC15的体质豁免，否则将陷入<STRONG><FONT color=#008000>麻痹Paralyzed</FONT></STRONG>状态一分钟。目标在其每回合结束时可以重新进行该豁免，豁免成功则终止其身上的该效应。<BR><STRONG>重获充能Regaining 
Charges</STRONG>。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P>
</body></html>
