<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>恐惧魔杖</title></head><body>
<h2>恐惧魔杖 Wand of Fear</h2>
<P><EM>魔杖，珍稀（需同调）</EM><BR>这根魔杖具有7充能。<BR><STRONG>法术Spells</STRONG>。持握这根魔杖时，你可以从中施展下列表格中的一道法术（豁免DC15）。施展对应法术所需消耗的充能数如表格所示。</P>
<P>
<TABLE style="WIDTH: 99%; BORDER-COLLAPSE: collapse" borderColor=#000000 
cellSpacing=0 cellPadding=3 width="99%" border=0>
  
  <TR>
    <TD bgColor=#f5c589>
      <P align=center><STRONG>法术</STRONG></P></TD>
    <TD bgColor=#f5c589 width="30%">
      <P align=center><STRONG>充能消耗</STRONG></P></TD></TR>
  <TR>
    <TD>
      <P align=center><U><I>命令术Command</I></U> （只能命令走开或趴下）</P></TD>
    <TD width="30%">
      <P align=center>1</P></TD></TR>
  <TR>
    <TD bgColor=#ebebeb>
      <P align=center><U><I>恐惧术Fear</I></U> （范围改为60尺锥形）</P></TD>
    <TD bgColor=#ebebeb width="30%">
      <P align=center>3</P></TD></TR></TABLE></P>
<P><STRONG>重获充能Regaining 
Charges</STRONG>。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P>
</body></html>
