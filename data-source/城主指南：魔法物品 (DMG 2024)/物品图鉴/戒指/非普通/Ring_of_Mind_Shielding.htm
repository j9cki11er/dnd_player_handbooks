<h2>心灵护盾戒指 Ring of Mind Shielding</h2>
<P><EM>戒指，非普通（需同调）</EM><BR>着装此戒指期间，你免疫能让其他生物阅读你的思想、辨别你在说谎、知晓你阵营或生物类型的魔法。只有在你允许时，生物才能与你进行心灵感应交流。<BR>你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作来让戒指变的无法被察觉，持续至你脱下戒指、<FONT color=#008000><STRONG>死亡</STRONG></FONT>或执行另一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作使其可被察觉为止。<BR>如果你在着装戒指期间<STRONG><FONT color=#008000>死亡</FONT></STRONG>，你的灵魂将进入戒指中，除非其内已寄宿着其他灵魂。你可以留在戒指内或奔向来世。只要你的灵魂处在戒指中，你就可以与着装它的任何生物进行心灵感应交流。着装者无法阻止这种心灵感应交流。</P>
