<html lang="zh-CN"><head><meta charset="utf-8"><title>公羊戒指</title></head><body>
<h2>公羊戒指 Ring of the Ram</h2>
<P><EM>戒指，珍稀（需同调）<BR></EM>这枚戒指具有3充能，且在每日黎明时重获1d3已消耗的充能。着装此戒指期间，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1至3充能，对60尺内的一个可见生物进行一次远程法术攻击。戒指创造出一个灵体公羊脑袋并进行具有+7加值的攻击检定。命中时，你每消耗1充能，目标就会受到2d10点力场伤害并且从你的方向被推离5尺。<BR>作为另一种用法，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1至3充能，以尝试破坏一件60尺内你可见且未被着装或携带的非魔法性的物体。戒指将进行力量检定，你每消耗1充能，此检定便具有+5加值。</P>
</body></html>
