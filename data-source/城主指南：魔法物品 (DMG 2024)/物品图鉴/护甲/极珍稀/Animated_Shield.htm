<html lang="zh-CN"><head><meta charset="utf-8"><title>活化盾</title></head><body>
<h2>活化盾 Animated Shield</h2>
<P><EM>护甲（盾牌），极珍稀（需同调）<BR></EM>持握此盾牌期间，你可以用<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>使其活化。盾牌将飞到空中并悬浮在你所占据的空间中保护你，如同你正持用着它一般，且同时解放你的双手。盾牌保持活化1分钟，如果你陷入<STRONG><FONT color=#008000>失能Incapacitated</FONT></STRONG> 、<STRONG><FONT color=#008000>死亡</FONT></STRONG> 、或用<STRONG><FONT color=#008000>附赠动作</FONT></STRONG> 
终止其效应时，活化会提前结束。如果活化结束时你有空闲的手空着，盾牌将落回你手里；否则它会掉落在地上。</P>
