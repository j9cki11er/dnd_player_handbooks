<html lang="zh-CN"><head><meta charset="utf-8"><title>鲜花法杖</title></head><body>
<h2>鲜花法杖 Staff of Flowers</h2>
<P><EM>法杖，普通</EM><BR>这根木制法杖具有10充能。持握此法杖期间，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1充能，使你周身5尺内的一小块地面、土壤或从法杖里绽放出一朵鲜花。如果你未指定花朵的品种，法杖则会创造出带有清香的雏菊。花朵是无害且非魔法性的，并且会如常生长或枯萎。<BR><STRONG>重获充能Regaining 
Charges</STRONG> 
。这根法杖在每日黎明时重获1d6+4已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，法杖将化为花瓣并且永久消失。</P>
</body></html>
