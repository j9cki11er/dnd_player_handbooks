<html lang="zh-CN"><head><meta charset="utf-8"><title>强袭法杖</title></head><body>
<h2>强袭法杖 Staff of Striking</h2>
<P><EM>法杖，极珍稀（需同调）</EM><BR>这根法杖可被用作一根魔法长棍（用这根长棍发动的攻击检定和伤害掷骰获得+3加值）。<BR>这根法杖具有10充能。当你用其发动近战攻击并命中时，你可以消耗至多3充能。每消耗1充能都将额外造成1d6力场伤害。<BR><STRONG>重获充能Regaining 
Charges</STRONG> 
。这根法杖在每日黎明时重获1d6+4已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，法杖将变为一根非魔法性的长棍。</P>
</body></html>
