<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>火焰法杖</title></head><body>
<h2>火焰法杖 Staff of Fire</h2>
<P><EM>法杖，极珍稀（需德鲁伊，术士，魔契师或法师同调）<BR></EM>持握这根法杖期间，你获得火焰伤害的抗性。<BR><STRONG>法术Spells</STRONG>。这根法杖具有10充能。持握此法杖期间，你可以从法杖中施展以下表格中的一道法术，使用你自己的法术豁免DC。施展相应法术所需消耗的充能数如下表所示。</P>
<P>
<TABLE style="WIDTH: 99%; BORDER-COLLAPSE: collapse" borderColor=#000000 
cellSpacing=0 cellPadding=3 width="99%" border=0>
  
  <TR>
    <TD bgColor=#f5c589>
      <P align=center><STRONG>法术</STRONG></P></TD>
    <TD bgColor=#f5c589 width="30%">
      <P align=center><STRONG>充能消耗</STRONG></P></TD></TR>
  <TR>
    <TD>
      <P align=center><U><I>燃烧之手Burning Hand </I></U> </P></TD>
    <TD width="30%">
      <P align=center>1</P></TD></TR>
  <TR>
    <TD bgColor=#ebebeb>
      <P align=center><U><I>火球术Fireball</I></U> </P></TD>
    <TD bgColor=#ebebeb width="30%">
      <P align=center>3</P></TD></TR>
  <TR>
    <TD>
      <P align=center><U><I>火墙Wall 
      of Fire</I></U>   </P></TD>
    <TD width="30%">
      <P align=center>4</P></TD></TR></TABLE></P>
<P><STRONG>重获充能Regaining 
Charges</STRONG>。这根法杖在每日黎明时重获1d6+4已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，法杖将崩解为煤渣并被摧毁。</P>
