<html lang="zh-CN"><head><meta charset="utf-8"><title>誓仇弓</title></head><body>
<h2>誓仇弓 Oathbow</h2>
<P><EM>武器（长弓或短弓），极珍稀（需同调）</EM><BR>当你弯弓搭箭时，誓仇弓会用精灵语悄声念出“速歼敌”。当你用此武器发动远程攻击时，你可以说出命令词“负我者死”，而这次攻击的目标将成为你的仇敌，直到它死亡或直到七日后的黎明之时。你同时只能指明一名这样的仇敌。仇敌死后，你可以在下个黎明后重新选择仇敌。<BR>使用此弓对仇敌发动远程攻击时，你的攻击检定具有优势。另外，目标不会从半身掩护与四分之三掩护中受益，你也不会因为超出常规射程而承受劣势。如果攻击命中，你的仇敌将额外受3d6穿刺伤害。<BR> 
只要你的仇敌还活着，你使用其他武器发动的攻击检定便会承受劣势。</P>
</body></html>
