<html lang="zh-CN"><head><meta charset="utf-8"><title>霜铭</title></head><body>
<h2>霜铭 Frost Brand</h2>
<P><EM>武器（长柄刀、巨剑、长剑、刺剑、弯刀或短剑），极珍稀（需同调）</EM><BR>当你用此魔法武器以一次攻击检定命中目标时，目标将受额外受到1d6寒冷伤害。此外，持握此武器期间你对火焰伤害具有抗性。<BR>在严寒环境中，此武器将会发出10尺明亮光照以及其外10尺的微光光照。<BR>拔出此武器时，你可以选择让周围30尺内的所有非魔法火焰熄灭。该词条一经使用，直到1小时之后才可再次使用。</P>
</body></html>
