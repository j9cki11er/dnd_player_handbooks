<html lang="zh-CN"><head><meta charset="utf-8"><title>九命夺杀者</title></head><body>
<h2>九命夺杀者 Nine Lives Stealer</h2>
<P><EM>武器（任意简易武器或军用武器），极珍稀（需同调）</EM><BR>你用该魔法武器发动的攻击检定和伤害掷骰获得+2加值。<BR><STRONG>夺命杀Life 
Stealing</STRONG> 
。该武器有1d8+1充能。当你用该武器攻击一名生命值不足100的生物且在攻击检定中掷出20时，该生物必须成功通过一次DC15的体质豁免否则立刻因生命力被该武器吸干而死（亡灵与构装自动成功于此豁免）。如果该生物因此被杀死，九命夺杀者将失去1充能。该武器会在充能耗尽后失去这一词条。</P>
