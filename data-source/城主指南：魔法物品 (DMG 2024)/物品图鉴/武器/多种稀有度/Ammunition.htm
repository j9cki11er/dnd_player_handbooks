<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>弹药（+1、+2、+3）</title></head><body>
<h2>弹药 Ammunition，+1、+2、+3</h2>
<P><EM>武器（任意弹药），非普通（+1）/珍稀（+2）/极珍稀（+3）</EM><BR>你使用此魔法弹药进行的攻击检定和伤害掷骰具有加值，加值的数值取决于弹药的稀有度。此弹药一旦击中目标即不再具有魔法效果。<BR>此类弹药一般以10或20枚为一组被发现或售卖。10枚此类弹药的价值等同于一瓶稀有度相同的药水。</P>
</body></html>
