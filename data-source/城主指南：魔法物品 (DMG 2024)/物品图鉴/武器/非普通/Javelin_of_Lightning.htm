<html lang="zh-CN"><head><meta charset="utf-8"><title>闪电标枪</title></head><body>
<h2>闪电标枪 Javelin of Lightning</h2>
<P><EM>武器（标枪），非普通<BR></EM>当你用该武器发动的攻击检定命中时，你可以选择令其造成闪电伤害而非穿刺伤害。<BR><STRONG>闪电束Lightning 
Bolt</STRONG>。当你向至多120尺内的一个目标投掷该武器时，你可以选择不进行远程攻击检定，而是改为将该武器变为一道闪电束。该闪电束会在你和目标之间形成一个5尺线状区域，目标及该区域内的每个生物（除你之外）都必须进行一次DC13的敏捷豁免，豁免失败者受到4d6闪电伤害，豁免成功则伤害减半。该武器会在造成该伤害后立即回到你的手中。直到下个黎明前，该词条都无法再使用。</P>
</body></html>
