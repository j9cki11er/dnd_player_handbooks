<h2>巨人屠杀者 Giant Slayer</h2>
<P><EM>武器（任意简易武器或军用武器），珍稀</EM><BR>你用此魔法武器发动的攻击检定和伤害掷骰获得+1加值。<BR>你用此武器命中一名巨人时，该巨人额外受到与武器伤害类型相同的2d6点伤害，且必须成功通过一次DC15的力量豁免否则陷入<STRONG><FONT color=#008000>倒地Prone</FONT></STRONG>状态。</P>
