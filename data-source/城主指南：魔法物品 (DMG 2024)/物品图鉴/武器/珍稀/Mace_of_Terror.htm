<html lang="zh-CN"><head><meta charset="utf-8"><title>恐惧之锤</title></head><body>
<h2>恐惧之锤 Mace of Terror</h2>
<P><EM>武器（硬头锤），珍稀（需同调）</EM><BR>这把魔法武器具有3充能，并在每日黎明时重获1d3已消耗的充能。持握这把武器期间，你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1充能，来从该武器中释放出一股恐惧波动。30尺内每个你所选择的生物都必须成功通过一次DC15的感知豁免，否则将陷入<STRONG><FONT color=#008000>恐慌</FONT></STRONG>状态，持续1分钟。以这种方式陷入<STRONG><FONT color=#008000>恐慌</FONT></STRONG>的生物在其回合内必须尽可能的向远离你的方向移动，并且它不能发动<STRONG><FONT color=#008000>借机攻击</FONT></STRONG>。它只能选择进行<STRONG><FONT color=#008000>疾走</FONT></STRONG>动作，或尝试摆脱一个阻止其移动的效应。如果无处可逃，则它可以执行<STRONG><FONT color=#008000>回避</FONT></STRONG> 
动作。该生物在每个自己的回合结束时可以再次进行此豁免，豁免成功则其身上的该效应提前结束。</P>
</body></html>
