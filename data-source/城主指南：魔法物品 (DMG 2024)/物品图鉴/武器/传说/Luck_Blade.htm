<h2>吉兆之刃 Luck Blade</h2>
<P><EM>武器（长柄刀、巨剑、长剑、刺剑、弯刀、镰刀或短剑），传说（需同调）<BR></EM>你用此魔法武器进行的攻击检定和伤害掷骰获得+1加值。携带此武器期间，你进行的豁免检定具有+1加值。<BR><STRONG>幸运Luck</STRONG>。在你携带此武器于身上期间，只要你未陷入<STRONG><FONT color=#008000>失能</FONT></STRONG>状态，你就可以向它祈求好运（无需动作），重骰一次失败的D20检定。你必须使用重骰的结果。该词条一经使用，直至下个黎明你都无法再次使用。<BR><STRONG>许愿Wish</STRONG>。此武器具有1d3充能。持握此武器期间，你可以消耗1充能，从此武器中施展<U><I>祈愿术wish</I></U>。该词条一经使用，直至下个黎明你都无法再次使用。充能耗尽时，此武器失去该词条。</P>
