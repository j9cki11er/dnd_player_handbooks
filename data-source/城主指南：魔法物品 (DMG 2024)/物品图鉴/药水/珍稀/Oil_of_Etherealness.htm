<h2>以太化之油 Oil of Etherealness</h2>
<P><EM>药水，珍稀<BR></EM>一扁瓶的以太化之油可以覆盖住连带着其着装与携带的装备的一个中型或小型生物（生物体型每比中型大一级，就需要多用一扁瓶）。抹上油需要花费10分钟。被影响的生物将会获得<U><I>以太化Etherealness</I></U>法术的效应，持续1小时。<BR>与瓶中油膏类似的浑浊的灰色油珠会在其容器的外壁形成，并迅速蒸发。</P>
