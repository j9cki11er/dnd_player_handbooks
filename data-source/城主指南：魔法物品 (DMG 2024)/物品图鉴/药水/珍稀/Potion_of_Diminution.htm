<h2>衰减药水 Potion of Diminution</h2>
<P><EM>药水，珍稀</EM><BR>当你饮下这瓶药水时，你获得法术<U><I>变巨术/缩小术Enlarge/Reduce</I></U>中的“缩小”效应，持续1d4小时（无需专注）。<BR>药液中的红色部分不断收缩成一个小球，随后又膨胀起来，把周围的清澈药液染红。即使摇晃药水瓶也不会打断这个过程。</P>
