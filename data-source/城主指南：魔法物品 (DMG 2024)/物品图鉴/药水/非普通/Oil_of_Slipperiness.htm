<html lang="zh-CN"><head><meta charset="utf-8"><title>滑溜之油</title></head><body>
<h2>滑溜之油 Oil of Slipperiness</h2>
<P><EM>药水，非普通</EM><BR>一扁瓶的滑溜之油可以覆盖住连带着其着装与携带的装备的一个中型或小型生物（生物体型每比中型大一级，就需要多用一扁瓶）。抹上油需要花费10分钟。被影响的生物将会获得<U><I>行动自如</I></U>法术的效应，持续8小时。<BR>此外，以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作，油可以被泼到地面上并覆盖10尺方形区域，并在此区域内复现出<U><I>油腻术Grease</I></U>法术的效应，持续8小时。<BR>这种粘稠的黑色油膏浑浊且厚重，但在被倒出来时却又流动迅速。</P>
</body></html>
