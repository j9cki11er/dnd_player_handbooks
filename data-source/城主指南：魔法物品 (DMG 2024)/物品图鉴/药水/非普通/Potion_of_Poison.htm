<h2>剧毒药水 Potion of Poison</h2>
<P><EM>药水，非普通<BR></EM>这瓶混合物看起来，闻起来和尝起来都和<STRONG><FONT color=#0000ff>治疗药水Potion of Healing</FONT></STRONG> 
 
或其他增益药水相似。<BR>然而，这实际上是一瓶用<STRONG><FONT color=#800080>幻术</FONT></STRONG>魔法伪装的毒药。<U><I>鉴定术Identify</I></U>可以揭露其本质。<BR>如果你饮下这瓶药水，你受到4d6毒素伤害并必须通过DC13的体质豁免否则陷入<STRONG><FONT color=#008000>中毒</FONT></STRONG>状态，持续1小时。</P>
