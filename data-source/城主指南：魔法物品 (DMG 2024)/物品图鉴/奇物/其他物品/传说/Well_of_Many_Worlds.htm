<html lang="zh-CN"><head><meta charset="utf-8"><title>诸界之井</title></head><body>
<h2>诸界之井 Well of Many Worlds</h2>
<P><EM>奇物，传说<BR></EM>这块丝绸般柔软的精致黑色布料折叠起来有手帕大小，展开时则为直径6尺的圆形。<BR>你能够以一个<U>魔法</U>动作展开诸界之井，将它布置在坚实表面上，产生一扇直径6尺、通向另一个世界或存在位面的圆形双向传送门。每次此物品打开传送门时，由DM决定它所连接的地方。传送门保持开启，直至位于其5尺内的一名生物以一个<U>魔法</U>动作抓住布料的边缘把它折叠起来，来将传送门关闭。<BR> 
诸界之井一经使用，在1d8小时内都无法再次打开传送门。 </P>
</body></html>
