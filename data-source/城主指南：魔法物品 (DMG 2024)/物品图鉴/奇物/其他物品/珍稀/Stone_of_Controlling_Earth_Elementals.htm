<h2>命令土元素石核 Stone of Controlling Earth Elementals</h2>
<P><EM>奇物，珍稀<BR></EM>在你用这块5磅重的石核接触地面期间，你能够以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作召唤一只<STRONG><U>土元素EarthElemental</U></STRONG>。土元素会出现在你30尺内一处由你选择的未占据空间、理解你所说的语言、服从你的命令、使用你的先攻值并在你之后立即执行其回合。土元素会在1小时后、它死亡时、或你用一个<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>将其解消时消失。直到下个黎明前，石核都无法再以该方式进行使用。
