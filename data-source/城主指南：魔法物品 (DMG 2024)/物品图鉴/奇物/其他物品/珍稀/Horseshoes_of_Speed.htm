<h2>加速马蹄铁 Horseshoes of Speed</h2>
<P><EM>奇物，珍稀<BR></EM>这些马蹄铁四个为一套。你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作将其中一个马蹄铁与一匹马或类似生物的蹄子接触，随后马蹄铁就会附着在蹄子上。移除一个马蹄铁也需要一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作。<BR> 
当四个马蹄铁都附着在同一生物身上期间，其速度增加30尺。
