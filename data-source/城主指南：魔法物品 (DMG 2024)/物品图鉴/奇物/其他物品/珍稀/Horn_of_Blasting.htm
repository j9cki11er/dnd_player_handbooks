<html lang="zh-CN"><head><meta charset="utf-8"><title>音爆号角</title></head><body>
<h2>音爆号角 Horn of Blasting</h2>
<P><EM>奇物，珍稀<BR></EM>你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作说出号角的命令词然后吹响号角。号角将产生30尺锥状的音爆，其声音可传播远达600尺。锥状区域内的每名生物必须进行一次DC15的体质豁免检定。豁免失败的生物将受5d8雷鸣伤害并陷入<FONT color=#008000><STRONG>耳聋</STRONG></FONT>状态1分钟，成功则仅受一半伤害。由玻璃或晶体构成且未被携带或着装的物件会受到10d8雷鸣伤害。<BR> 
每次使用号角的魔法都有20%的概率导致其爆炸。爆炸会对吹响它的人造成10d6力场伤害并摧毁号角。  
</P>
