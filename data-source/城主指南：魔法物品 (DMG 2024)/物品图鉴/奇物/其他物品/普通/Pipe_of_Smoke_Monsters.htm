<h2>怪物烟斗 Pipe of Smoke Monsters</h2>
<P><EM>奇物，普通</EM><BR>用这个烟斗抽烟期间，你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作呼出一股烟雾并使其变成一个生物的形状，例如一条龙、一只呋噜、或者一只史拉蟾。该形状必须小到足以容纳进1尺立方，并且其会在数秒后失去其形状，变回一股普通的烟雾。</P>
