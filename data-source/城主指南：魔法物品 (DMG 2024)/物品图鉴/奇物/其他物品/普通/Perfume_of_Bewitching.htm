<h2>迷醉香水 Perfume of Bewitching</h2>
<P><EM>奇物，普通</EM><BR>这个小瓶内装有足够单次使用的魔法香水。你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作将香水喷洒或涂抹在自己身上，其效应会持续1小时。在持续时间内，你对试图影响一个位于你周边5尺范围内的生物而进行的所有魅力（欺瞒和游说）检定都具有优势。</P>
