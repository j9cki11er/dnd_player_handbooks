<h2>霍华德香料包 Heward's Handy Spice Pouch</h2>
<P><EM>奇物，普通<BR></EM>这个腰包看起来是空的，并具有10充能。持握此小包期间，你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作消耗1充能，说出任何一种非魔法的食物调味料的名字（例如盐、胡椒、藏红花、或香菜），并从腰包中取出一撮所需的调味料。一撮调料就足以调味一顿单人份食物。小包会在每日黎明时恢复1d6+4已消耗的充能。</P>
