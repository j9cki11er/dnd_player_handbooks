<h2>静报号角 Horn of Silent Alarm</h2>
<P><EM>奇物，普通<BR></EM>这个号角具有4充能，且在每日黎明时恢复1d4已消耗的充能。你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作消耗1充能吹响它。一名600尺范围内由你选择的生物将能听到其声音。除此之外的任何其他生物都无法听见这个号角的声音。</P>
