<h2>撰写乐器 Instrument of Scribing</h2>
<P><EM>奇物，普通<BR></EM>这把乐器具有3充能，并在每日黎明时重获所有已消耗的充能。在你使用这把乐器进行演奏期间，你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作消耗1充能，在你周边30尺范围内一个可见的非魔法物件或表面上写下一段魔法信息。这段信息以一种你熟知的语言书写，且其最长六个单词。如果你是一名吟游诗人，则你可写的单词上限增加七个，并且你可以使信息发出微弱光芒，使其在非魔法黑暗中清晰可见。信息会在24小时后消失，也可用法术<U><I>解除魔法Dispel Magic</I></U> 
将其抹去。</P>
