<h2>幻象乐器 Instrument of Illusions</h2>
<P><EM>奇物，普通<BR></EM>在你使用这把乐器进行演奏期间，你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作在源自乐器的5尺光环区域内创造出无害的、幻象般的视觉效应。如果你是一名吟游诗人，则光环的范围将提升至15尺。简单的视觉效应包括了幻光的音符、虚幻的舞者、舞动的蝴蝶、以及飘散的雪花。这种魔法效应既无触感亦无声音，且它们显然是幻象。你终止演奏的同时，此效应结束。</P>
