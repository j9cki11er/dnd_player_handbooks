<h2>骗术锁 Lock of Trickery</h2>
<P><EM>奇物，普通</EM><BR> 
这把锁看上去就像是一把普通的<STRONG><FONT color=#0000ff>锁Lock</FONT></STRONG> 
（见玩家手册第六章），并配备有一把唯一的钥匙。这把锁里的锁齿会魔法性的拒斥那些撬锁的窃贼。任何为撬开这把锁而进行的敏捷检定都会具有劣势。</P>
