<h2>修补绳 Rope of Mending</h2>
<P><EM>奇物，普通<BR></EM>这根50尺长的绳索可以在被切成任意数量的小段后自行修复。以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作，你可以让所有相互接触且当前并未以其他方式被使用的绳段重新结合在一起。如果其中一段修补绳丢失或被摧毁，则其长度将永远缩短。</P>
