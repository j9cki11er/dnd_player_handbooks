<html lang="zh-CN"><head><meta charset="utf-8"><title>说话玩偶</title></head><body>
<h2>说话玩偶 Talking Doll</h2>
<P><EM>
奇物，普通（需同调）</EM><BR>这个玩偶在你周边5尺范围内期间，你可以花费一次短休教会它说至多六段短语，并设定玩偶说出每段短语的条件，每段短语的长度都不能超过六个单词。你也可以使用新短语替换旧短语。设定的条件必须在玩偶周边5尺范围内发生，这样玩偶才会说话。例如，当有人捡起这个玩偶时，它可能会说一句“我想要一块糖”。当你与玩偶的同调结束时，玩偶的短语会消失。</P>
</body></html>
