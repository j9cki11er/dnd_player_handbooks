<html lang="zh-CN"><head><meta charset="utf-8"><title>启蒙花盆</title></head><body>
<h2>启蒙花盆 Pot of Awakening</h2>
<P><EM>奇物，普通<BR></EM>你可以在这个10磅重的黏土花盆里种植一株普通灌木，待其生长30天后，这株灌木会魔法性的转化为一株<STRONG>启蒙灌木Awakened 
Shrub</STRONG> 
。当灌木被启蒙时，它的根系会打碎花盆，并导致花盆被摧毁。这株启蒙灌木会对你友好并服从你的命令。如果没有你的命令，它会什么也不做。</P>
