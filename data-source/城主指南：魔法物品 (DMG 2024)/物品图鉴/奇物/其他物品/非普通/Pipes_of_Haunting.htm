<h2>颤栗乐笙 Pipes of Haunting</h2>
<P><EM>奇物，非普通</EM><BR>颤栗乐笙具有3充能，并在每日黎明时重获1d3已消耗的充能。你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作演奏该乐笙，并消耗其1充能来创作一首怪诞且令人着迷的曲调。你周边30尺范围内每个你选择的生物都必须成功通过一次DC15的感知豁免，豁免失败者会陷入<STRONG><FONT color=#008000>恐慌</FONT></STRONG>状态，持续1分钟。豁免失败的生物可以在其每个回合结束时重复该豁免，豁免成功则结束对自身的影响。豁免成功的生物将在24小时内免疫该乐笙的效应。 
   
</P>
