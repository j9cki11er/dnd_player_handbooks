<h2>显像提灯 Lantern of Revealing</h2>
<P><EM>奇物，非普通<BR></EM>这盏附盖提灯在点亮期间会发出30尺半径的明亮光照以及额外30尺微光光照，并且仅需1品脱燃油即可燃烧6小时。位于提灯明亮光照范围内的隐形生物或物件将被其显形。你可以使用一个<STRONG><FONT color=#008000>操作</FONT></STRONG>动作放下附盖，让提灯仅在5尺范围内提供微光光照。
