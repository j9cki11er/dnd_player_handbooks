<html lang="zh-CN"><head><meta charset="utf-8"><title>干燥粉</title></head><body>
<h2>干燥粉 Dust of Dryness</h2>
<P><EM>奇物，非普通</EM><BR>这个小包里共装着1d6+4把粉末。你可以用一个<STRONG><FONT color=#008000>操作</FONT></STRONG>动作将一把粉末洒到水面上。粉末将把15尺立方区域的水变成一个弹珠大小的小球，漂浮或停止在粉末被洒下的位置附近。小球的重量可以忽略不计。 
生物可以用<STRONG><FONT color=#008000>操作</FONT></STRONG> 
动作将小球摔在某个结实表面，以令小球破碎并释放其中的水分。这样做会摧毁小球并使其失去其魔力。<BR>你可以用操作动作将一把粉末洒在5尺内一个身体大部分由水组成的元素生物（例如<STRONG><U>水元素Water 
Elemental</U></STRONG>或<STRONG><U>水诡Water 
Weird</U> 
</STRONG>）身上。此时该生物须进行一次DC13的体质豁免，豁免失败者受到10d6点暗蚀伤害，豁免成功则伤害减半。 
   
</P>
</body></html>
