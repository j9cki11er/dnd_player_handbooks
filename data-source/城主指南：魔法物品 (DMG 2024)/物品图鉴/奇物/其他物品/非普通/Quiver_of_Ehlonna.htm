<html lang="zh-CN"><head><meta charset="utf-8"><title>艾罗娜的箭袋</title></head><body>
<h2>艾罗娜的箭袋 Quiver of Ehlonna</h2>
<P><EM>奇物，非普通<BR></EM>这个箭袋有三个大小不一的隔层，每个隔层都连接着一个异次元空间。无论其中存放着多少东西，箭袋的总重量都永远都不会超过2磅。最小的隔层可以容纳至多60支箭、弩矢或类似的物件；中等大小的隔层可以容纳至多18支标枪或类似的物件；最大的隔层可以容纳至多6件长条型的物件，例如弓、法杖、矛等。<BR>你可以如同从普通的箭袋或剑鞘中抽出物品一般抽出艾罗娜箭袋中的物品。 
   
</P>
