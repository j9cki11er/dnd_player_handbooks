<h2>西风马蹄铁 Horseshoes of a Zephyr</h2>
<P><EM>奇物，极珍稀<BR></EM>这些马蹄铁四个为一套。你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作将其中一个马蹄铁与一匹马或类似生物的蹄子接触，随后马蹄铁就会附着在蹄子上。移除一个马蹄铁也需要一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作。<BR>四个马蹄铁同时附着在一匹马或类似的生物身上期间，它将悬浮在离地面4寸的高度，并可以如常移动。这使得该生物可以穿过或站在非固态或非稳定的平面上，例如水面或岩浆。它无视困难地形并且不会留下足迹。此外，该生物每天最多可以旅行12个小时，并且不会因为长时间旅行而获得力竭等级。</P>
