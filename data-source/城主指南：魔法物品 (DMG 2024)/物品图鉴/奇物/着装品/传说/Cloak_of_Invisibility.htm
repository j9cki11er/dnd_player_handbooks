<h2>隐身斗篷 Cloak of Invisibility</h2>
<P><BR><EM>奇物，传说（需同调）</EM><BR>此斗篷具有3充能，并在每日黎明时重获1d3已消耗的充能 。着装此斗篷期间，你能够以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作 
拉上兜帽并消耗1充能，以使自己进入<FONT color=#008000><STRONG>隐形Invisible</STRONG></FONT>状态，持续1小时。该效应在你褪下兜帽（无需动作）或不再着装此斗篷时提前结束。</P>
