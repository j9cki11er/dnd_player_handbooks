<h2>虹光法袍 Robe of Scintillating Colors</h2>
<P><EM>奇物，极珍稀（需同调）</EM><BR>这件长袍具有3充能，并每日黎明时重获1d3已消耗的充能。着装这件长袍期间，你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作并消耗1充能，让长袍不断变幻出各种耀眼的色彩图案，持续至你的下个回合结束。在此期间，长袍提供30尺明亮光照和额外30尺微光光照，能看到你的生物对你发动的攻击检定具有劣势。此外，长袍效应启用期间，任何处于长袍产生的明亮光照区域内且可以看到你的生物必须进行一次DC15的感知豁免，豁免失败则陷入<STRONG><FONT color=#008000>震慑</FONT></STRONG>状态，直到长袍的效应终止。</P>
</body></html>
