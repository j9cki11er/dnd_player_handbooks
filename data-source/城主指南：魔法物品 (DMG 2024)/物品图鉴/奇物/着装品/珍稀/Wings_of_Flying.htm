<h2>飞翼斗篷 Wings of Flying</h2>
<P><EM>
奇物，珍稀（需同调）<BR></EM>着装这件斗篷期间，你能够以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作将斗篷转变为你背上的一对翅膀。这对翅膀会持续1小时，或直至你使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作提前结束效应。这对翅膀会赋予你60尺飞行速度。如果翅膀消失时你仍在空中则你会坠落。翅膀消失后，你在1d12小时内无法再次使用它们。</P>
