<h2>蝙蝠斗篷 Cloak of the Bat</h2>
<P><EM>奇物，珍稀（需同调）</EM><BR>着装此斗篷期间，你的敏捷（隐匿）检定具有优势。在微光或黑暗的环境中，你可以抓住斗篷的边沿，利用它以获得40尺的飞行速度。如果你在以此法飞行时不再抓住斗篷边沿或不再处于微光或黑暗环境中，则你失去此飞行速度。<BR>着装此斗篷且身处微光或黑暗环境期间，你可以用一个<STRONG><FONT color=#008000>动作</FONT></STRONG>对自己施展法术 
<U><I>变形术Polymorph</I></U>，并以此变成一只<STRONG>蝙蝠bat</STRONG>。你在变成蝙蝠时保留自身的智力、感知和魅力属性。该词条一经使用，直至下个黎明前都无法再次使用。</P>
