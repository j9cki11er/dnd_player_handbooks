<h2>巫术帽 Hat of Wizardry</h2>
<P><EM>奇物，普通（需法师同调）</EM><BR>这顶锥形帽上点缀着星月。你着装此帽期间，你获得下述增益。<BR><STRONG>施法法器Spellcasting 
Focus</STRONG>。你可以将其作为你施展法师法术的施法法器。<BR><STRONG>未知法术Unknown 
Spell</STRONG>。你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作尝试施展一道你并未已知的戏法。所选戏法必须位于法师法表中，并且其施法时间必须为动作。你进行一次DC 
10的智力（奥秘）检定。检定成功，则你施展那道法术。检定失败，则你施法失败，用于施法的动作被浪费。无论检定成功与否，此词条一经使用，直到你完成一次长休之前不能再次使用。</P>
