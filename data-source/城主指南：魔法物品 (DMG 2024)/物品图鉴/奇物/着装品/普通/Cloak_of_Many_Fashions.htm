<h2>万众时尚斗篷 Cloak of Many Fashions</h2>
<P><EM>奇物，普通</EM><BR>着装此斗篷期间，你可以用一个<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>改变它的样式、颜色、及外表品质。这件斗篷的重量不会因此改变，且不论它的外观如何，这件斗篷永远只能是一件斗篷而不是别的东西。当然，这件斗篷可以用于复制其他魔法斗篷的外观，但它不会因此具有任何其他魔法斗篷的魔法能力。</P>
