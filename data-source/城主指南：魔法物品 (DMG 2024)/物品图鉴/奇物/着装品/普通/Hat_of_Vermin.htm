<html lang="zh-CN"><head><meta charset="utf-8"><title>害兽帽</title></head><body>
<h2>害兽帽 Hat of Vermin</h2>
<P><EM>奇物，普通</EM><BR>这顶帽子有3充能。持握此帽期间，你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作消耗1充能，召唤你选择的下述三种生物之一：一只<STRONG>蝙蝠Bat</STRONG>，一只<STRONG>青蛙Frog</STRONG>或一只<STRONG>鼠Rat</STRONG>。召唤出的生物魔法性地出现在帽子中，并且会试图尽快远离你。此生物对你和其他生物的态度是冷漠，且不在你的控制之下。它会如其种类的普通生物一般行动，且会在1小时或者生命值降至0点时消失。此帽在每日黎明时恢复所有已消耗的充能。</P>
