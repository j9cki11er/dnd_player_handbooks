<html lang="zh-CN"><head><meta charset="utf-8"><title>辟矢夺箭手套</title></head><body>
<h2>辟矢夺箭手套 Gloves of Missile Snaring</h2>
<P><EM>奇物，非普通（需同调）</EM><BR>在你穿戴该手套期间被远程或投掷武器造成的攻击检定命中时，若你至少空着一只手，则你可以用<STRONG><FONT color=#008000>反应</FONT></STRONG>来减少1d10+你的敏捷调整值的伤害。如果你把伤害减少到0，则你可以选择抓住击中你的抛掷物（前提是它的尺寸足够让你用手抓住）。</P>
</body></html>
