<h2>魅惑镜片 Eyes of Charming</h2>
<P><EM>奇物，非普通（需同调）</EM><BR>这副水晶镜片适合戴在眼前。它具有3充能。佩戴着这副镜片期间，你可以消耗至少1充能来施展<U><I>魅惑类人Charm Person</I></U>（豁免DC 
13）。若消耗1发充能，你可以施展一环版本的该法术。每多消耗一发充能，该法术的环阶就提升一环。镜片消耗掉的充能将在每天黎明时恢复。</P>
