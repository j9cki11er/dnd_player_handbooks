<h2>保健护符 Periapt of Health</h2>
<P><EM>奇物，非普通（需同调）</EM><BR>佩戴此吊坠期间，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作来恢复2d4+2生命值。一经使用，则其直至下个黎明前都无法再次使用。<BR>此外，佩戴着此吊坠期间，你在为避免或结束<STRONG><FONT color=#008000>中毒</FONT></STRONG>状态的豁免中具有优势。</P>
