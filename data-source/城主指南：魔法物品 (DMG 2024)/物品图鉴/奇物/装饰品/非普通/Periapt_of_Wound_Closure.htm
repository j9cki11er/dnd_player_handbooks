<h2>愈合护符 Periapt of Wound Closure</h2>
<P><EM>奇物，非普通（需同调）</EM><BR>佩戴此吊坠期间，你获得以下增益：<BR><STRONG>维持生命</STRONG>。每当你进行死亡豁免时，你都可以将掷骰中9及以下的骰值改为10，以此让失败的豁免改为成功。<BR><STRONG>加速自愈</STRONG>。每当你投掷一颗生命骰来恢复你的生命值时，你生命值恢复量翻倍。</P>
