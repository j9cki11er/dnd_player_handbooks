<h2>发条护符 Clockwork Amulet</h2>
<P><EM>奇物，普通</EM><BR>这枚铜制的护符内有数个互相咬合的微小齿轮，其以机械境——一个秩序至极，万物皆可被机械预测的位面——的魔法所驱动。模糊的滴答声与呼呼的噪音从中传出。<BR>佩戴该护符期间，当你进行一次攻击检定时，你可以放弃掷骰并在d20的骰值上取10。该词条一经使用，直至下个黎明前都无法再次使用。</P>
