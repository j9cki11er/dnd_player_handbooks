<h2>召唤气巨灵戒指 Ring of Djinni Summoning</h2>
<P><EM>戒指，传说（需同调）</EM><BR>着装此戒指期间，你能够以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作从气元素位面召唤一名特定的<STRONG><U>气巨灵djinni</U></STRONG>。该气巨灵将出现在位于你120尺内你选择的未占据空间中。只要你为之维持专注，气巨灵将持续存在，至多1小时，或在其生命值降至0时提前消失。<BR>被召唤期间，气巨灵对你和你的盟友态度友好，并将服从你的命令。如果你没有下达命令，则它除在遭受攻击时自卫外不会执行任何动作。<BR>气巨灵消失后，24小时内你都无法再次召唤它，若该气巨灵死亡，此戒指变为非魔法的。<BR>召唤气巨灵戒指通常由戒指所召唤的气巨灵制造，用来作为友谊或尊重的象征赠予凡人。</P>
