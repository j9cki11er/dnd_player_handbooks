<h2>影响动物戒指 Ring of Animal Influence</h2>
<P><EM>戒指，珍稀</EM><BR>这枚戒指具有3充能，并在每日黎明时重获1d3已消耗的充能。着装此戒指期间，你可以消耗1充能，从中施展以下法术之一（豁免DC13）：</P>
<UL>
  <LI>
<DIV><U><I>化兽为友Animal 
  Friendship</I></U> </DIV>
  </LI><LI>
<DIV><U><I>恐惧术Fear</I></U>（只影响野兽）</DIV>
  </LI><LI>
<DIV><U><I>动物交谈Speak with 
  Animals</I></U>  </DIV></LI></UL>
