<h2>统御权杖 Rod of Rulership</h2>
<P><EM>权杖，珍稀（需同调）</EM><BR>你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作来展示这根权杖，并向你可见的，周身120尺内你所指定的每个生物下令服从于你。每个目标必须通过一次DC15的感知豁免，否则陷入<STRONG><FONT color=#008000>魅惑</FONT></STRONG>状态8小时。在以这种方式被<STRONG><FONT color=#008000>魅惑</FONT></STRONG>期间，生物将视你为值得托付信赖的领袖。如果你或你的盟友伤害了目标，或命令目标去做违反其天性的行为时，以此法造成的<STRONG><FONT color=#008000>魅惑</FONT></STRONG>将终止。该词条一经使用，直至下个黎明前你都无法再次使用。</P>
