<h2>星辰法袍 Robe of Stars</h2>
<P><EM>奇物，极珍稀（需同调）</EM><BR>这件黑色或深蓝色的长袍上点缀着白色或银色的星星。着装这件长袍期间，你的豁免具有+1加值。<BR>法袍的前襟附近有六枚较大的星星。着装这件长袍期间，你可以使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作消耗其中一颗星星，以此施展五环版本的<U><I>魔法飞弹Magic 
Missle</I></U> 
。每日黄昏时分，1d6颗被消耗的星星将重新出现在法袍上。<BR>着装这件长袍期间，你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作使你和你着装或携带的物件一起进入星界，直至你再次使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作回到你原本所在的位面。此时你出现在自己之前占据的空间中，如果该空间已被占据，则你出现在最近的未占据空间。</P>
