<h2>通灵板 Spirit Board</h2>
<P><EM>
奇物，极珍稀</EM><BR>这块华丽木板的一面印有通用语字母表的字符，旁边还有“是”和“否”的字样，以及代表“吉”和“凶”的符号。通灵板配有一块心型的木制占卜板。这块占卜板必须放置在通灵板有字母的一面，才能让通灵板的魔法发挥作用。<BR>通灵板具有3充能，并在每日黎明时重获1已消耗的充能。施展法术时，你可以召唤死者灵魂引导占卜板在木板表面滑动，并通过指向木板上的字母或单词来回答你的问题。触摸占卜板期间，你可以花费1分钟施展一个法术，能施展的法术与所需充能如下表所示。</P>
