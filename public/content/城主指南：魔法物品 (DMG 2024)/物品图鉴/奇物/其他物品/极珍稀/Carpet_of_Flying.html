<h2>飞毯 Carpet of Flying</h2>
<P><EM>奇物，极珍稀<BR></EM>你可以用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作，说出飞毯的命令词来让它起飞或悬停。只要你在飞毯周围30尺内，它就会按照你的指示移动。<BR>飞毯有四种不同的尺寸，其具体如何则由DM进行选择或随机决定。飞毯的载重上限为表中数值的两倍，但超过正常载重时飞毯的飞行速度减半。</P>
