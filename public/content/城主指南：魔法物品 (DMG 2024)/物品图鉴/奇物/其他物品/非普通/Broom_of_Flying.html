<h2>飞天扫帚 Broom of Flying</h2>
<P><EM>奇物，非普通（需同调）</EM><BR>这把扫帚在平时如同一把普通的扫帚，你可以骑在它上面并使用一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作让它悬浮在你身下，此时它可以载着你在空中飞行。它的飞行速度为50尺，最多可载重400磅，但200磅以上的载重会将它的飞行速度降低到30尺。扫帚在你着陆或不再骑乘时便会停止悬浮。<BR>以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作，你可以指名1英里内一个你熟悉的地点，并令扫帚自行飞往该处。而如果扫帚在你周围1英里以内，你也能够以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作让它自行回到你的身边。 
   
</P>
