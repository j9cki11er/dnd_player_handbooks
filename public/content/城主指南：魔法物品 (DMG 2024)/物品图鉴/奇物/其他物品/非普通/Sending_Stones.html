<h2>短讯石 Sending Stones</h2>
<P><EM>
奇物，非普通</EM><BR>短讯石两颗一对，这两块石头经过雕刻而相互匹配，因此它们的配对非常容易辨认。触摸其中一块短讯石期间，你可以用它施展<U><EM>短讯术Sending</EM></U>，目标为另一块短讯石的携带者。如果另一块短讯石没有被任何生物携带，则你在使用短讯石时会得知这一情况，而短讯术将不会被施展。<BR>一旦使用其中一块短讯石施展了<U><EM>短讯术Sending</EM></U>，则两块短讯石直至下个黎明前都无法再次被使用。如果一块短讯石被摧毁，则与它配对的另一块石头也会失去其魔法。
