<h2>无踪粉 Dust of Disappearance</h2>
<P><EM>奇物，非普通</EM><BR>这些粉末形同细沙，其分量足够使用一次。你可以用<STRONG><FONT color=#008000>操作</FONT></STRONG>动作将粉末洒向空中，让你和源自你的10尺光环区域内的每个生物和物件变为<STRONG><FONT color=#008000>隐形</FONT></STRONG>状态2d4分钟。每个目标的隐形时长相同，一旦粉末的魔法生效，其即被消耗。如果一名受影响的生物发动攻击或者施展法术，则该生物的<STRONG><FONT color=#008000>隐形</FONT></STRONG>效应也随之终止。
