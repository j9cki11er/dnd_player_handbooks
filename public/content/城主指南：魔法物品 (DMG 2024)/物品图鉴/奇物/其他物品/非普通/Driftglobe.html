<h2>漂浮之球 Driftglobe</h2>
<P><EM>奇物，非普通<BR></EM>这个厚玻璃制成的小球重1磅。在它周围60尺内，你可以说出命令词以使它发出相当于法术 
<U><EM>光亮术light</EM></U> 或 <U><EM>昼明术daylight</EM></U>的光芒。使用一次后直至下个黎明前，<U><EM>昼明术daylight</EM></U>效应将无法再次使用。<BR>你可以用<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作来说出另一个命令词，以让发光球体飞到空中，漂浮在离地面不超过5尺的地方。球体将持续漂浮在空中，直到你或另一生物将它抓住。如果你离开球体周围60尺范围，则它将沿最短路径跟随你移动直到距离你60尺为止。如果它的移动遭到妨碍，它将闪烁着落回地面并回到启动前的状态，其发出的光芒也会熄灭。 
   
</P>
