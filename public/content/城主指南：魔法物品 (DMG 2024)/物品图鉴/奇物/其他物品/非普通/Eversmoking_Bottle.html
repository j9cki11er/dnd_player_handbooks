<h2>无尽烟壶 Eversmoking Bottle</h2>
<P><EM>奇物，非普通</EM><BR>以一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作，你可以开关这个瓶子。<BR>打开此瓶会使浓重的烟雾从中涌出，形成一团浓厚的烟云。烟云会充满源自此瓶的60尺光环区域。被烟云笼罩的区域处于重度遮蔽。<BR>只要瓶子保持开启，每1分钟此光环区域就会扩大10尺，最大达到120尺。<BR>关闭此瓶会使烟云固定在原地，直至10分钟后消散。一阵强风（例如<U><EM>造风术Gust of 
Wind</EM></U>所创造的）可以在1分钟后将其吹散。 
   
</P>
