<h2>次元镣铐 Dimensional Shackles</h2>
<P><EM>奇物，珍稀<BR></EM>你可以用<STRONG><FONT color=#008000>操作动作</FONT></STRONG>将此镣铐戴在一个<STRONG><FONT color=#008000>失能Incapacitate</FONT></STRONG>的生物身上。镣铐可以自行调整适应从小型到大型体型的生物。次元镣铐能够阻止被其约束的生物进行异次元移动，包括传送和异位面旅行。不过镣铐并不能阻止生物穿过一道连接异位面的传送门。<BR>你和你使用镣铐时指定的生物可以用操作动作直接解除此镣铐。每隔30日，被约束的生物可以进行一次DC30的力量（运动）检定，成功则破坏镣铐重获自由。  
</P>
