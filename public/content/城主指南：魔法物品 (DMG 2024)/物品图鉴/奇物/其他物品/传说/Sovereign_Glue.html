<h2>至尊胶 Sovereign Glue</h2>
<P><EM>奇物，传说</EM><BR>这种乳白色的粘稠物质可以把任何两个物件永久性地粘在一起。至尊胶必须被储存在一个内壁涂满了滑溜之油oil of slipperiness的瓶子或罐子中。被发现时，容器中装有1d6+1盎司的至尊胶。<BR>每盎司至尊胶可以覆盖1平方尺的表面。涂抹一盎司至尊胶需要一个<U>操作</U>动作，涂抹的胶水将在1分钟后凝固。一旦至尊胶凝固，被粘在一起的东西就只能用<EM><U>万溶剂universal 
solvent</U></EM>、<EM><U>以太化之油oil of etherealness</U></EM>或法术<U><I>祈愿术wish</I></U>才能分开。</P>
