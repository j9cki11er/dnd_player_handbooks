<h2>异界之门魔方 Cubic Gate</h2>
<P><EM>奇物，传说</EM><BR>这个边长3寸的立方体散发着明显的魔法能量。立方体的六个面分别连接到六个不同的存在位面，其中一面连接的是物质位面，而其他面所连接的位面则由DM决定。<BR>立方体具有3充能，并在每日黎明时重获1d3已消耗的充能。以一个<U>魔法</U>动作，你可以消耗此立方体的1充能，从立方体中施展下列法术之一。<BR><STRONG>异界之门Gate</STRONG>。按压立方体的其中一面，你施展法术<U><I>异界之门Gate</I></U>，打开连接到对应存在位面的传送门。<BR><STRONG>位面转移Plane 
Shift</STRONG>。按压两次立方体的其中一面，你施展法术<U><I>位面转移Plane 
Shift</I></U>，将目标传送至对应存在位面。</P>
