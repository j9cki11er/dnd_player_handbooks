<h2>黑暗碎片护符 Dark Shard Amulet</h2>
<P><EM>奇物，普通（需魔契师同调）</EM><BR>这个护符由来自异界的弹性材料碎片制成。佩戴此护符期间，你获得以下增益。<BR><STRONG>施法法器Spellcasting 
Focus</STRONG> 
。你可以把护符当作你施展魔契师法术时的法器使用。<BR><STRONG>未知法术Uknown 
Spell</STRONG> 。作为一个<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作 
，你可以尝试施展一道你未知的戏法。该戏法必须在魔契师法术列表之内且施法时间为1动作。随后你进行一次DC10的智力（奥秘）检定，检定通过则你施展该法术，检定失败则法术失效，且你施法所用的动作将被浪费。无论发生哪种情况，那之后直至你完成长休前都无法再次使用该词条。</P>
