<h2>鸟鸣法杖 Staff of Birdcalls</h2>
<P><EM>法杖，普通</EM><BR>这根木制法杖上装饰着鸟形雕像。它具有10充能。持握此法杖期间，你可以执行<STRONG><FONT color=#008000>魔法</FONT></STRONG>动作来消耗1充能，使其创造出周围120尺范围内都能听到的以下声音之一：麻雀啾啾、乌鸦哇哇、鸭子嘎嘎、小鸡咯咯、大鹅呱呱、潜鸟呜呜、火鸡咕咕、海鸥嗷嗷、夜枭嘤嘤或老鹰呖呖。<BR><STRONG>重获充能Regaining 
Charges</STRONG> 
。这根法杖在每日黎明时重获1d6+4已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，法杖将在一阵无害的鸟羽之云中爆炸并且永久消失。</P>
