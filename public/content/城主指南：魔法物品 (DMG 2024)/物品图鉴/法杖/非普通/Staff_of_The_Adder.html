<h2>蝰蛇法杖 Staff of The Adder</h2>
<P><EM>法杖，非普通（需同调）</EM><BR>以一个<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>，你可以将法杖的头部变为一条会动的毒蛇，持续一分钟，或直至你执行<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>将法杖还原为非活化形态。<BR>当你执行攻击动作时，你可以使用触及5尺的活化蛇头来发动其中一次攻击检定。这次攻击检定使用你的熟练加值与感知调整值。命中时，目标将受到1d6穿刺伤害与3d6毒素伤害。<BR>蛇头在活化期间可以被攻击。它具有AC15，HP20，免疫毒素与心灵伤害。蛇头的生命值降为0时法杖将被摧毁。只要法杖未被摧毁，它就会在还原为非活化形态时恢复所有失去的生命值。</P>
