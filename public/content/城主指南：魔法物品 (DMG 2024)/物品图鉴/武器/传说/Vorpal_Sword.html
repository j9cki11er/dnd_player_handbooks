<h2>斩首剑 Vorpal Sword</h2>
<P><EM>武器（长柄刀、巨剑、长剑或弯刀），传说（需同调）</EM><BR>你用此魔法武器进行的攻击检定和伤害掷骰获得+3加值。此外，此武器无视对挥砍伤害的抗性。<BR>你在以此武器进行的攻击检定的d20中掷出20，且目标生物至少有一个脑袋时，你砍下该生物的一颗头。如果该生物无法在失去这颗头的情况下生存，则它立即<STRONG><FONT color=#008000>死亡</FONT></STRONG>。若该生物具有对挥砍伤害的免疫、没有头或不需要头部、或是DM认为此武器无法斩下如此巨大的头颅，则作为被斩首的替代，该生物在此次被命中时额外受到30挥砍伤害。若该生物具有传奇抗性，它可以消耗1次该特性的使用次数来避免被斩首，但仍需受到额外伤害。</P>
