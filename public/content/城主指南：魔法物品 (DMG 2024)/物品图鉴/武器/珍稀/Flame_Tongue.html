<h2>焰舌 Flame Tongue</h2>
<P><EM>武器（任意近战武器），珍稀（需同调）</EM><BR>持握此魔法武器期间，你可以用<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>说出其命令词，以让这把武器用来造成伤害的部分被烈焰所包覆。武器的火焰散发出40尺范围的明亮光照，以及额外40尺的微光光照。<BR>武器燃烧期间将对其命中的目标造成额外2d6点火焰伤害。火焰将持续燃烧到你丢下武器、将它收起或入鞘，或是用一个<STRONG><FONT color=#008000>附赠动作</FONT></STRONG>说出命令词为止。</P>
