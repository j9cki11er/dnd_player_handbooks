<h2>恶魔护甲 Demon Armor</h2>
<P><EM>护甲（任意轻甲、中甲、或重甲），极珍稀（需同调）</EM><BR>着装该护甲期间，你的AC具有+1加值，且你理解深渊语。此外，护甲如利爪般的护腕会令你的徒手打击造成1d8点挥砍伤害，代替徒手打击原本的钝击伤害，你徒手打击的攻击检定与伤害掷骰获得+1加值。<BR><STRONG>诅咒Curse</STRONG>。着装这件被诅咒的护甲后，除非你被施予法术<U><I>移除诅咒remove 
curse</I></U> 
或类似的魔法效应，否则你无法将其卸下。着装该护甲期间，你对恶魔进行的攻击检定具有劣势，且你对抗恶魔的法术与特殊能力进行的豁免检定同样具有劣势。</P>
