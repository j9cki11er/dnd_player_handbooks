<P><EM>魔杖，珍稀（需同调）<BR></EM>这根魔杖具有7充能。<BR><STRONG>法术Spells</STRONG>。持握这根魔杖时，你可以从中施展下列表格中的一道法术（豁免DC17）。施展对应法术所需消耗的充能数如表格所示。</P>

<P><STRONG>重获充能Regaining 
Charges</STRONG>。这根魔杖在每日黎明时重获1d6+1已消耗的充能。当充能数耗尽时，骰一次d20。如果骰值为1，魔杖将化作飞灰并被摧毁。</P>
