<H4 id="Maelstrom">大漩涡｜Maelstrom</H4>
<P><EM>五环 塑能（德鲁伊）<BR></EM><b>施法时间：</b>1 动作<BR><b>施法距离：</b>120 
尺<BR><b>法术成分：</b>V、S、M（折成漏斗状的纸张或叶片）<BR><b>持续时间：</b>专注，至多 1 分钟<BR>你指定施法距离之内可见的一点，大量的水在此出现，构成一个深达5尺、半径达30 尺的大漩涡。你选择的点必须处于地面或者水体表面。直到法术结束前，该区域成为困难地形，所有在该区域开始其回合的生物都必须进行一次力量豁免，豁免失败将受到 
6d6 钝击伤害并被拉向中心 10 尺。</P>
