<H4 id="Vitriolic_Sphere">浓酸球｜Vitriolic Sphere</H4>
<P><EM>四环 塑能（术士、法师）</EM><EM><SUP>Legacy</SUP></EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>150 
尺<BR><b>法术成分：</b>V、S、M（一滴巨型蜗牛的胆汁）<BR><b>持续时间：</b>立即<BR>你指定距离之内的一点，一颗发光的 1 尺直径的强酸球飞向那个位置，爆炸并溅射 
20 尺半径内的球形区域。在该区域中的每个生物必须进行一次敏捷豁免。豁免失败的生物不仅将受到 10d4 点强酸伤害，其下个回合结束时还将再受到 5d4 
点强酸伤害。若豁免成功，该生物只受到初始伤害的一半且不会在其下个回合结束时受到伤害。<BR><b>升环施法。</b>当你使用五环或更高的法术位施放该法术时，使用的法术位每高一环，初始伤害便增加 
2d4。</P>
