<H4 id="Mind_Spike">心灵尖刺｜Mind Spike</H4>
<P><EM>二环 预言（术士、魔契师、法师）</EM><EM><SUP>Legacy</SUP></EM> <BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>60 尺<BR><b>法术成分：</b>S<BR><b>持续时间：</b>专注，至多 1 小时<BR>你接触施法距离内一个你可见生物的内心。目标必须进行感知豁免检定，若失败会受到 3d8 
心灵伤害，成功则只承受一半。在目标豁免失败时，你在法术结束之前能时刻得知目标所在的位置，只要你们还处于同一位面上。当你拥有这个信息时，目标将不能对你躲藏，并且如果它隐形了，在对抗你时它不能从这个状态中受益。<BR><b>升环施法。</b>当你使用三环或更高的法术位施放该法术时，使用的法术位每高一环，伤害就增加 1d8。</P>
