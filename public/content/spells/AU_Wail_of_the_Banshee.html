<H4 id="Wail_of_the_Banshee">女妖之嚎｜Wail of the Banshee</H4>
<P><EM>九环 死灵（术士、魔契师、法师）</EM>
<BR><B>施法时间：</B>动作 
<BR><B>施法距离：</B>60尺 
<BR><B>法术成分：</B>V 
<BR><B>持续时间：</B>立即
<BR>你发出一阵能够杀死听到此声之人的惊怖尖啸。选择施法距离内至多10名生物。每个生命值为50或更低的目标死亡。生命值大于50的目标则进行一次体质豁免，豁免失败者受到12d10心灵伤害并陷入耳聋状态1小时。豁免成功则目标仅受半伤。听不到你的生物不受此法术影响。</P>
