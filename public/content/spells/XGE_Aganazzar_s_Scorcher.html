<H4 id="Aganazzar's_Scorcher">阿迦纳萨喷火术｜Aganazzar's Scorcher</H4>
<P><EM>二环 塑能（术士、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>30 尺<BR><b>法术成分：</b>V、S、M（一片红龙的鳞片）<BR><b>持续时间：</b>立即<BR>一道长 30 尺，宽 5 
尺的翻涌火线从你向一个你选定的方向蔓延。在该线中的生物必须进行一次敏捷豁免检定。豁免失败的生物受到 3d8 点火焰伤害，而豁免成功则只受到上述伤害的一半。<BR><b>升环施法。</b>当你使用三环或更高的法术位施放该法术时，使用的法术位每高一环，伤害便增加 
1d8。</P>
