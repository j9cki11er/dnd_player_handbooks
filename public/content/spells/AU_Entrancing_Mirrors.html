<H4 id="Entrancing_Mirrors">迷魂魔镜｜Entrancing Mirrors</H4>
<P><EM>八环 幻术（吟游诗人、术士、魔契师、法师）</EM><BR><B>施法时间：</B>动作 <BR><B>施法距离：</B>90尺 
<BR>
<B>
法术成分：
</B>V、S、M（一枚镜子碎片） 
<BR>
<B>
  持续时间：</B>专注，至多1分钟
<BR>
 你创造大量幻影魔镜，用其迷惑至多三名施法距离内由你选择的你可见的生物。
<BR>


每个目标都要进行一次智力豁免。豁免失败者受7d6心灵伤害并陷入震慑状态。以此法被震慑期间，目标的速度减半。豁免成功则目标仅受半伤。<BR>被震慑的目标可在其每个回合结束时重复此豁免，成功则结束此法术对其的影响。</P>
