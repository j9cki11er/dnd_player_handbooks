<H4 id="Frostbite">霜噬｜Frostbite</H4>
<P><EM>塑能 戏法（德鲁伊、术士、魔契师、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>60 
尺<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>立即<BR>你令距离之内，一个你能看见的生物开始结冰。该目标必须进行一次体质豁免检定。若豁免失败，该目标受到 1d6 
点寒冷伤害，并在其下个回合结束前进行的下一次武器攻击检定中得到劣势。<BR>你到达 5 级时，该法术的伤害增加 1d6（变为 2d6）。11 级时再加 
1d6（变为 3d6），17 级时再加 1d6（变为 4d6）。</P>
