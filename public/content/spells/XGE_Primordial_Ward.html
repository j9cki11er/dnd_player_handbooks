<H4 id="Primordial_Ward">原初守护｜Primordial Ward</H4>
<P><EM>六环 防护（德鲁伊）</EM><BR><b>施法时间：</b>1 
动作<BR><b>施法距离：</b>自身<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>专注，至多1分钟<BR>本法术的持续时间内，你具有强酸、寒冷、火焰、闪电、以及雷鸣伤害的抗性。<BR>当你受到上述类型之一的伤害时，你可以用反应来得到对该种类型伤害的免疫，此举同样会免疫触发此效果的这次伤害。使用此反应后，上述抗性效果将消失，你获得对应伤害的免疫，持续直至你的下个回合结束（那时法术将提前终止）。</P>
