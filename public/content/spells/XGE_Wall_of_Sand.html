<H4 id="Wall_of_Sand">沙墙术｜Wall of Sand</H4>
<P><EM>三环 塑能（法师）<BR></EM><b>施法时间：</b>1 动作<BR><b>施法距离：</b>90 尺<BR><b>法术成分：</b>V、S、M（一捧沙）<BR><b>持续时间：</b>专注，至多 
10 分钟<BR>你在距离内你能看到的地表的一点上召唤出由舞动的沙子构成的墙体。你可以制造出的墙体长度至多为 30 尺，高度至多为 10 尺，厚度至多为 10 
尺。其将在法术终结时消失。它能阻挡视觉线，但无法阻挡移动。处于墙体所在的空间内的生物目盲，在其中移动时，每移动 1 尺需要消耗 3 尺的移动力。</P>
