<H4 id="Festing_Blast">溃烂爆发｜Festing Blast</H4>
<P><EM>四环 死灵（德鲁伊、术士、魔契师、法师）<BR></EM><B>施法时间：</B>动作 <BR>
<B>
施法距离：
</B>自身 
<BR>
<B>法术成分：</B>V、S 
<BR>
<B>
 持续时间：</B>1分钟
<BR>
一道60尺长、10尺宽的线状瘴气自你的位置向你选择的一个方向爆散而出。该线状区域内的每个生物都必须进行一次体质豁免。豁免失败者受4d10暗蚀伤害且在法术持续时间内陷入中毒状态。
<BR>因该法术而陷入中毒的生物在其每个回合开始时受2d10毒素伤害。中毒生物在其每个回合结束时重复进行此豁免，成功则结束此法术对其的影响。
<BR><STRONG>升环施法。</STRONG>你使用的法术位每比四环高一环，初始伤害便增加1d10。</P>
