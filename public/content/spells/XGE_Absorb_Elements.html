<H4 id="Absorb_Elements">吸收元素｜Absorb Elements</H4>
<P><EM>一环 防护（德鲁伊、游侠、术士、法师、奇械师）</EM> <BR><b>施法时间：</b>1 
反应，当你受到强酸、寒冷、火焰、闪电、或雷鸣伤害时执行<BR><b>施法距离：</b>自身<BR><b>法术成分：</b>S<BR><b>持续时间：</b>1 
轮<BR>此法术将捕获部分袭来的能量，减轻能量对你的效果，并将捕获的能量储存起来，用以强化你的下一次近战攻击。你获得触发法术的那个伤害类型的抗性，持续直至你的下个回合的开始。此外，在你的下个回合中，你的近战攻击首次命中时，攻击目标将额外受到1d6点伤害，类型与触发法术的伤害类型相同，之后此法术终止。<BR><b>升环施法。</b>当你使用二环或更高的法术位施放该法术时，使用的法术位每高一环，额外伤害便增加 
1d6。</P>
