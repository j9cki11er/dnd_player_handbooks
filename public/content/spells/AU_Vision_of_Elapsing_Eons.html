<H4 id="Vision_of_Elapsing_Eons">瞥见亘古一瞬｜Vision of Elapsing Eons</H4>
<P><EM>九环 幻术（吟游诗人、术士、魔契师、法师）</EM>
<BR><B>施法时间：</B>动作 <BR><B>施法距离：</B>120尺 
<BR><B>法术成分：</B>V、S <BR><B>持续时间：</B> 1分钟
<BR>你欺骗施法距离内一名你可见的生物，使其误以为自己正在目睹自身及周围一切的分崩离析，如同亿万年光阴在转瞬间流逝。目标必须进行一次智力豁免，豁免失败则受到10d12心灵伤害，并在法术持续时间内陷入麻痹状态。
<BR>麻痹期间，目标可在其每个回合结束时重复此豁免。豁免失败则其获得一层力竭。豁免成功则法术结束，若目标5尺内的其他生物用一个动作将其从幻境中摇醒，此法术也会提前结束。</P>
