<H4 id="Spellfire_Flare">咒火闪焰｜Spellfire Flare</H4>
<P><i>一环 
塑能（术士，法师）</i>
<BR><b>施法时间：</b>动作
<BR><b>施法距离：</b>60尺
<BR><b>法术成分：</b>V、S
<BR><b>持续时间：</b>立即<BR>你释放出一道耀眼的焰能爆。对施法距离内的一个目标发动一次远程法术攻击；结算该次攻击检定时目标无法从半身掩护和四分之三掩护中获益。若命中，则目标受到2d10光耀伤害。<BR><STRONG>升环施法。</STRONG>你使用的法术位每比一环高一环，你便可额外发射一道焰能爆。你可以令这发新的焰能爆瞄准你原先的目标或是另一个目标。每道焰能爆都需要分别进行攻击。</P>
