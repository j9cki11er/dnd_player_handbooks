<H4 id="Laeral's_Silver_Lance">莱拉的银辉长枪｜Laeral's Silver Lance</H4>
<P><i>三环 
塑能（牧师、术士、法师）</i>
<BR><b>施法时间：</b>动作
<BR><b>施法距离：</b>自身
<BR><b>法术成分：</b>V、S、M（一枚价值250+GP的银针）
<BR><b>持续时间：</b>立即<BR>银色能量自你之处爆发，覆盖一处120尺长、5尺宽的线状区域。每名位于区域内的由你选择的生物都进行一次力量豁免检定。豁免失败者受到3d10力场伤害且陷入倒地状态。豁免成功仅受半伤。<BR><STRONG>升环施法。</STRONG>你使用的法术位每比三环高一环，法术的伤害就增加1d10。</P>
