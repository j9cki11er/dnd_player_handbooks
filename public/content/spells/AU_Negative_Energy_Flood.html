<H4 id="Negative_Energy_Flood">负能量洪流｜Negative Energy Flood</H4>
<P><EM>五环 死灵（魔契师、法师）</EM><BR><B>施法时间：</B>动作<BR> <B>施法距离：</B>60尺<BR> <B>法术成分：</B>V、M（一块碎骨和一片黑丝绸）<BR> <B>持续时间：</B>立即<BR>你向施法距离内一个你可见生物发射出数道丝带状的负能量。若目标不是亡灵，则其进行一次体质豁免，豁免失败则受到3d10+25暗蚀伤害，豁免成功则伤害减半。被该伤害杀死的类人生物将在你的下一回合开始时转化为一只在24小时内受你的语言指令控制的<STRONG><U>丧尸Zombie</U></STRONG>。24小时之后，它将依自己的本性行动。<BR>若目标为亡灵，则其获得3d10临时生命值。<BR><STRONG>升环施法。</STRONG>你使用的法术位每比五环高一环，法术的伤害便增加1d10。</P>
