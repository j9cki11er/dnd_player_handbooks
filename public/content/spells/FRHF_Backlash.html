<H4 id="Backlash"> 反冲术｜Backlash</H4>
<P><i>四环 
防护（吟游诗人、术士、魔契师、法师）</i>
<BR><b>施法时间：</b>反应，当你受到伤害时，作为对该次伤害的回应执行
<BR><b>施法距离：</b>60尺
<BR><b>法术成分：</b>V
<BR><b>持续时间：</b>立即<BR>你将破坏性的能量抵御并弹开，令该次你受到的伤害降低4d6+你的施法属性调整值。<BR>若触发该次反应的伤害来自一名位于施法距离内的生物，则你可以迫使该生物进行一次体质豁免。豁免失败则其受到4d6力场伤害，豁免成功则仅受半伤。<BR><STRONG>升环施法。</STRONG>你使用的法术位每比四环高一环，法术能减免的伤害量和造成的力场伤害就都增加1d6。</P>
