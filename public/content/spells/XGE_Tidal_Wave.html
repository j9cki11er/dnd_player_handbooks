<H4 id="Tidal_Wave">潮涌｜Tidal Wave</H4>
<P><EM>三环 咒法（德鲁伊、术士、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>120 
尺<BR><b>法术成分：</b>V、S、M（一滴水）<BR><b>持续时间：</b>立即<BR>  你召唤出浪潮拍打距离之内的区域。区域的长度至多为 30 
尺，宽度至多为 10 尺，高度至多为 10 
尺。在区域内的每个生物均必须进行一次敏捷豁免检定。豁免失败则该生物受到4d8钝击伤害并应击倒地。豁免成功则仅受到一半伤害，且不会倒地。水之后会沿着地表向四周流去，熄灭区域内和周围 30 
尺内所有有未受保护的火焰，而后消失不见。</P>
