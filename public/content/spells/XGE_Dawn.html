<H4 id="Dawn">拂晓｜Dawn</H4>
<P><EM>五环 塑能（牧师、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>60 尺<BR><b>法术成分：</b>V、S、M（价值至少 100gp 
的旭日坠饰）<BR><b>持续时间：</b>专注，至多 1 分钟<BR>拂晓之光落在施法距离内你指定的地点，形成一道 30 尺半径、40 
尺高度的明亮光柱。这个光芒被视为阳光。<BR>当光柱出现时，每个处于其中的生物都必须进行体质豁免，失败将受到 4d10 
光耀伤害，成功则只承受一半。在光柱中结束回合的生物也必须再次进行这个豁免。<BR>如果你在光柱 60 尺内，你可以在你的回合以一个附赠动作将它移动 60 
尺。</P>
