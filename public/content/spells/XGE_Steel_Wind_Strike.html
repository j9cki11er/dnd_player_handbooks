<H4 id="Steel_Wind_Strike">钢风斩｜Steel Wind Strike</H4>
<P><EM>五环 咒法（游侠、法师）</EM><EM><SUP>Legacy</SUP></EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>30尺<BR><b>法术成分：</b>S、M（一把价值至少 1sp 
的近战武器）<BR><b>持续时间：</b>立即<BR>你舞动用于施法的武器，随后忽然消失并发起袭击，恰如同一阵钢铁的疾风。选择施法距离内最多 5 
个可见生物。向每个生物分别进行一次近战法术攻击。若击中，目标承受 6d10 力场伤害。<BR>在这之后，你可以传送到一个你击中或未击中的生物周围 5 
尺内，你可以看见的未占据空间。</P>
