<H4 id="Dragon's_Breath">龙息术｜Dragon's Breath</H4>
<P><EM>二环 变化（术士、法师）</EM><EM><SUP>Legacy</SUP></EM> <BR><b>施法时间：</b>1 附赠动作<BR><b>施法距离：</b>触碰<BR><b>法术成分：</b>V、S、M（一枚辣椒）<BR><b>持续时间：</b>专注，至多 1 
分钟<BR>你触碰一个自愿生物，使它能喷吐出魔法能量，只要它拥有一张嘴。选择强酸、寒冷、火焰、闪电或毒素中的一种。直到法术结束前，生物可以使用一个动作放射出 
15 尺锥形的对应能量。区域内的每个生物必须进行敏捷豁免检定，若失败将受到 3d6 
对应能量类型的伤害，成功则只承受一半。<BR><b>升环施法。</b>当你使用三环或更高的法术位施放该法术时，使用的法术位每高一环，伤害就增加 1d6。</P>
