<H4 id="Life_Transference">生命转换｜Life Transference</H4>
<P><EM>三环 死灵（牧师、法师）</EM> <BR><b>施法时间：</b>1 
动作<BR><b>施法距离：</b>30尺<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>立即<BR>你牺牲自己的部分健康来修复其他生物的伤口。你受到 4d8 
暗蚀伤害（这个暗蚀伤害无法以任何方式减少），同时施法距离内一个由你选择的可见生物恢复生命值，数值等于你承受的暗蚀伤害的两倍。<BR><b>升环施法。</b>当你使用四环或更高的法术位施放该法术时，使用的法术位每高一环，暗蚀伤害就增加 
1d8。</P>
