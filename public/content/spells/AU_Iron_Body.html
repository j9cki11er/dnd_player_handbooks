<H4 id="Iron_Body">钢铁之躯｜Iron Body</H4>
<P><EM>八环 变化（术士、魔契师、法师）</EM>
<BR><B> 施法时间：</B>动作<BR><B>施法距离：</B>触碰 <BR><B>法术成分：</B>V、S、M（价值250+gp的钻石尘，作为该法术的耗材） 
<BR>
<B>
持续时间：
</B>专注，至多1小时 
<BR>
你将你触碰的一名自愿生物化作活着的钢铁。直至法术结束之前，目标的力竭等级不会提升；目标具有对钝击、火焰、穿刺和挥砍伤害的抗性；且免疫毒素伤害以及麻痹、石化和中毒状态。若目标在你施法时已经陷入麻痹、石化或中毒，则其身上的这些状态立即结束。</P>
