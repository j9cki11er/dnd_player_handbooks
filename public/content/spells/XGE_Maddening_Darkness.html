<H4 id="Maddening_Darkness">疯狂之暗｜Maddening Darkness</H4>
<P><EM>八环 塑能（魔契师、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>150 
尺<BR><b>法术成分：</b>V、M（一滴沥青与一滴水银的混合物）<BR><b>持续时间：</b>专注，至多 10 分钟<BR>魔法黑暗从范围内你指定的一点延伸至半径 60 
尺的球形范围，直到法术结束。黑暗会蔓延过拐角。生物的黑暗视觉不能看穿这片黑暗。非魔法的光源，以及八环和八环以下法术创造的光亮不能照亮这片区域。<BR>尖叫声，低语声，以及疯狂的大笑声时不时能从球形范围内听见。每当一名生物在范围内开始回合，它必须进行一次感知豁免，失败时将受到8d8心灵伤害，成功则只承受一半。</P>
