<B>施法距离：</B>自身<BR><B>法术成分：</B>V、S、M（一块肉干）<BR> <B>持续时间：</B>专注，至多1分钟<BR>你呼唤一道闪烁的灰色光环，笼罩你的周身。在法术持续时间内，你可以执行魔法动作来投射出一道覆盖60尺锥状区域的灰色光幕。该区域内的生物必须成功通过一次体质豁免否则获得一层力竭。该法术无法将生物的力竭等级提升至4以上。 <BR>该法术造成的力竭等级会在法术结束时被移除。</P>
