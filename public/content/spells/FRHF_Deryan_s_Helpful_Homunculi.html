<P><i>二环 
咒法（牧师、法师）</i>
<BR><b>施法时间：</b>动作或仪式
<BR><b>施法距离：</b>自身
<BR><b>法术成分：</b>V、S、M（价值100+GP的宝石粉末，作为法术的耗材；外加一套你熟练的工匠工具）
