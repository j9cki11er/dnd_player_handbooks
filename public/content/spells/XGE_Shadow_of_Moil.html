<H4 id="Shadow_of_Moil">莫伊之影｜Shadow of Moil</H4>
<P><EM>四环 死灵（魔契师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>自身<BR><b>法术成分：</b>V、S、M（镶嵌在宝石里的亡灵的眼睛，价值至少 
150GP）<BR><b>持续时间：</b>专注，至多 1 
分钟<BR>法术持续时间内，如同火焰般的暗影笼罩在你的身体周遭，使你对于其他人视为身处重度遮蔽下。<BR>暗影会将你周围 10 
尺内的微光光照转变为黑暗，明亮光照转变为微光。<BR>直到法术结束之前，你具有光耀伤害抗性。此外，当在你周围 10 
尺内的生物用攻击命中你时，暗影会袭向那个生物，对它造成 2d8 点暗蚀伤害。</P>
