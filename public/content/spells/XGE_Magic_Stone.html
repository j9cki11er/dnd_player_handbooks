<H4 id="Magic_Stone">魔石术｜Magic Stone</H4>
<P><EM>变化 戏法（德鲁伊、魔契师、奇械师）</EM><BR><b>施法时间：</b>1 附赠动作<BR><b>施法距离：</b>触碰<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>1 
分钟<BR>你接触一到三块小石块，向其中注入魔法的力量。你或其他人可以通过徒手或使用投石索来投掷小石块之一以进行一次远程法术攻击。若徒手投掷，其射程为 
60 尺。若除你之外的其他人使用小石块进行攻击，攻击者在其攻击检定中加上你的施法属性调整值，而非攻击者的。若击中，目标受到 
1d6+你的施法属性调整值点 
钝击伤害。无论击中与否，在那块石块上的魔法都会终结。<BR>若你再次释放此法术，此法术先前释放时，在受到影响的石块上的效果会提前终结。</P>
