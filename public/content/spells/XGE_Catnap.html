<H4 id="Catnap">假寐术｜Catnap</H4>
<P><EM>三环 惑控（吟游诗人、术士、法师、奇械师）</EM> 
<EM><SUP>Legacy</SUP></EM> <BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>30 尺<BR><b>法术成分：</b>S、M（一撮沙子）<BR><b>持续时间：</b>10 
分钟<BR>你做一个使人平静的手势，在施法距离内，你选择最多 3 
名你可以看见的自愿生物在法术持续时间中进入昏迷状态。如果生物受到伤害或者某人使用动作将他摇醒，对于那个目标法术会提前结束。如果目标在整个持续期间都保持昏迷，目标会得到一次短休的好处，但是在完成一次长休之前将不能再受到这个法术的影响。<BR><b>升环施法。</b>当你使用四环或更高的法术位施放该法术时，使用的法术位每高一环，你就可以多指定 
1 个额外的自愿生物作为目标。</P>
