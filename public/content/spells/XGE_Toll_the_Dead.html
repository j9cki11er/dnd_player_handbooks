<H4 id="Toll_the_Dead">亡者丧钟｜Toll the Dead</H4>
<P><EM>死灵 戏法（牧师、魔契师、法师）</EM><EM><SUP>Legacy</SUP></EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>60 
尺<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>立即<BR>你指向一个处于距离内、你能看见的生物，一阵哀痛的铃声在空中鸣响。目标必须通过一次感知豁免检定，否则受到 
1d8 点暗蚀伤害。若目标失去了任何量的生命值，它改为受到 1d12 点暗蚀伤害。<BR>此法术的伤害在你达到 5 级（2d8 或 2d12），11 级（3d8 
或 3d12），和 17 级（4d8 或 4d12）时提高一个伤害骰。</P>
