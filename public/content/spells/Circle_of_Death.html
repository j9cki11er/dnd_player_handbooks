<h2>死亡法阵｜Circle of Death</h2>
<P><EM>六环 死灵（术士、魔契师、法师）</EM> <BR><STRONG>施法时间：</STRONG>动作<BR><STRONG>施法距离：</STRONG>150尺<BR><STRONG>法术成分：</STRONG>V、S、M（价值500GP+的研磨黑珍珠粉末）<BR><STRONG>持续时间：</STRONG>立即<BR>
一阵负能量波从施法距离内你选择的一点放出，覆盖以该点为中心半径60尺<U>球状</U>区域。每个位于区域内的生物都进行一次体质豁免。豁免失败者受到8d8点暗蚀伤害，豁免成功则受到半数伤害。<BR><STRONG>升环施法。</STRONG>使用的法术位每比六环高一环，法术的伤害就增加2d8。
