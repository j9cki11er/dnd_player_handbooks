<H4 id="Cause_Fear">造成恐惧｜Cause Fear</H4>
<P><EM>一环 死灵（魔契师、法师）</EM> <BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>60 尺<BR><b>法术成分：</b>V<BR><b>持续时间：</b>专注，至多 1 
分钟<BR>你唤醒了一个处于施法距离内、你能看见的生物内心的凡性。此法术对于构装生物或亡灵无效。目标必须通过一次感知豁免检定，否则在持续时间内陷入恐慌。恐慌生物可以在它的每个回合结束时重复进行这个豁免检定，若成功将结束法术对自身的效果。<BR><b>升环施法。</b>当你使用二环或更高的法术位施放该法术时，使用的法术位每高一环，你就可以多指定一个额外生物作为目标。每个被你指定的生物相互之间的施法距离必须在 
30 尺内。</P>
