<H4 id="Wardaway">制敌术｜Wardaway</H4>
<P><i>一环 
防护（吟游诗人、牧师、圣武士、法师）</i>
<BR><b>施法时间：</b>动作
<BR><b>施法距离：</b>60尺
<BR><b>法术成分：</b>V、S、M（一个黏土做的小手塑像）
<BR><b>持续时间：</b>立即<BR>你向施法距离内的一名生物掷出一片令其晕眩的魔法力场。目标进行一次体质豁免（构装和亡灵自动豁免成功）。豁免失败则目标受2d4力场伤害，其速度减半至你的下一回合开始，且目标在其下一回合中仅可以执行一个动作或一个附赠动作（但不能同时执行二者）。豁免成功则仅受半伤。<BR><STRONG>升环施法。</STRONG>你使用的法术位每比一环高一环，法术的伤害就增加2d4。</P>
