<H4 id="Flame_Arrows">烈焰箭矢｜Flame Arrows</H4>
<P><EM>三环 变化（德鲁伊、游侠、术士、法师）</EM> <BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>触碰<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>专注，至多 1 
小时<BR>你接触一个装有箭矢或弹药的箭袋。当一个目标被从箭袋中取出的弹药进行的远程武器攻击击中时，该目标额外受到 1d6 
点火焰伤害。弹药上法术的魔力将在其击中或未击中目标时消失，而法术将在从箭袋中取出 12 
发弹药后终结。<BR><b>升环施法。</b>当你使用四环或更高的法术位施放该法术时，使用的法术位每高一环，你能以此法术影响的弹药的数量便增加 2 发。</P>
