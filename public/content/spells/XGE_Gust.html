<H4 id="Gust">舞风术｜Gust</H4>
<P><EM>变化 戏法（德鲁伊、术士、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>30 
尺<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>立即<BR>在距离内的，你能看到的一点上，空气被你掌握，被迫产生了下述效应之一：</P>
<UL>
  <LI>由你选择的一个中型或更小的生物必须通过一次力量豁免检定，否则会被你推离 5 尺。 
  </LI><LI>你能制造出小小的空气爆破，足以移动一个未被持握或携带的，不超过 5 磅的物体。该物体被推离你 10 
  尺。以此法产生的力不足以造成伤害。 
  </LI><LI>你利用空气制造出无害的感官感受，例如令树叶沙沙作响，令百叶窗闭合，或你的衣服在微风中摆动。</LI></UL>
