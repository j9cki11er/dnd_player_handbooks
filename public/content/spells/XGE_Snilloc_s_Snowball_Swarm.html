<H4 id="Snilloc's_Snowball_Swarm">史尼洛雪球群｜Snilloc's Snowball Swarm</H4>
<P><EM>二环 塑能（术士、法师）</EM> <BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>90 尺<BR><b>法术成分：</b>V、S、M（一块冰或一小块白色岩石碎片）<BR><b>持续时间：</b>立即<BR>在距离之内的，一个由你指定的点上，大量的魔法雪球喷涌而出。以该点为中心，5 
尺半径的球形区域内的所有生物必须进行一次敏捷豁免。豁免失败则受到 3d6 点寒冷伤害，成功则只受到半数伤害。<BR><b>升环施法。</b>当你使用三环或更高的法术位施放该法术时，使用的法术位每高一环，伤害便增加 1d6。</P>
