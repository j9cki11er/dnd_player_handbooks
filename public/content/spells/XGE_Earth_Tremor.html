<H4 id="Earth_Tremor">地颤｜Earth Tremor</H4>
<P><EM>一环 塑能（吟游诗人、德鲁伊、术士、法师）</EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>10 
尺<BR><b>法术成分：</b>V、S<BR><b>持续时间：</b>立即<BR>你在施法距离内引发地面颤动。处于该区域，除你之外的其他生物必须进行一次敏捷豁免检定。若检定失败，该生物受到 
1d6 点钝击伤害并倒地。若区域的地表为松软的土壤或石头，其在被清理之前成为困难地形。每 5 尺直径的部分都需要至少 1 
分钟来手动清理。<BR><b>升环施法。</b>当你使用二环或更高的法术位施放该法术时，使用的法术位每高一环，伤害便增加 1d6。</P>
