<H4 id="Uncertain_Footing">步履维艰｜Uncertain Footing</H4>
<P><EM>二环 幻术（奇械师、吟游诗人、魔契师、法师）</EM><BR><B>施法时间：</B>动作 
<BR>
<B>
施法距离：
</B>120尺 
<BR>
<B>
  法术成分：</B>V、S、M（一块扭曲的透镜） 
<BR>
<B>
持续时间：



</B>专注，至多1分钟
<BR>你创造出诸如岩石或地刺般的障碍物幻象，尝试干扰至多三名施法距离内你可见的生物，影响其移动能力。每名目标进行一次智力豁免。若豁免失败，则目标的速度减半，且无法执行疾走动作。一名被妨碍的目标在其每个回合结束时重复此豁免，若豁免成功，则其身上的此法术终止。</P>
