<H4 id="Ice_Knife">冰刃｜Ice Knife</H4>
<P><EM>一环 咒法（德鲁伊、术士、法师）</EM><EM><SUP>Legacy</SUP></EM><BR><b>施法时间：</b>1 动作<BR><b>施法距离：</b>60 
尺<BR><b>法术成分：</b>S、M（一滴水或一块冰）<BR><b>持续时间：</b>立即<BR>你制造出一块冰晶裂片，并将它射向施法距离内的一个生物。你对目标进行一次远程法术攻击。若击中，目标受到 
1d10 点穿刺伤害。无论击中与否，裂片都会在之后爆裂。目标和周围 5 尺范围内的每个生物必须通过一次敏捷豁免检定，否则受到 2d6 
点寒冷伤害。<BR><b>升环施法。</b>当你使用二环或更高的法术位施放该法术时，使用的法术位每高一环，寒冷伤害便增加 1d6 点。</P>
