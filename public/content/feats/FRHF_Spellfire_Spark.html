<h2>咒火火花 Spellfire Spark</h2>
<P><FONT color=#800000><b>咒火火花 Spellfire Spark</b>
<BR></FONT><i>起源专长</i>
<BR>你获得以下增益。
</P>


<UL>
  <LI>
<DIV><b>魔法吸收Magic Absorption。</b>每回合一次，当你受到来自法术或魔法效应的伤害时，你令你受到的总伤害减少1d4。你无法在陷入失能状态期间使用该增益。
</DIV>
  </LI><LI>
<DIV><b>咒火之焰Spellfire Flame。</b>你习得戏法<color=PURPLE><U><EM>圣火术Sacred Flame</EM></U>
。该法术的施法属性是智力、感知或魅力（当你选取此专长时选择）。你也能够以附赠动作施展该戏法，次数等于你的熟练加值，当你完成长休时重获所有已消耗的使用次数。
</DIV></LI></UL>
