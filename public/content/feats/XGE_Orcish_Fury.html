<h2>兽人狂怒 Orcish Fury</h2>
<P><STRONG><FONT color=#800000>兽人狂怒 Orcish 
Fury</FONT></STRONG><BR><EM>先决条件: 
半兽人</EM><BR>你内在的怒火在永无止境的燃烧着，你获得下列增益：<BR> · 你的力量或体质+1，上限为20。<BR> · 
当你用简易武器或军用武器发动的攻击命中时，你可以额外掷一枚武器的伤害骰并将其作为额外伤害加入到本次攻击的伤害中，伤害类型与武器本身的伤害类型相同。一旦你使用了这一能力，直到你完成一次短休或长休前你都不能再次使用它。<BR> · 
使用 坚韧不屈Relentless Endurance 种族特质之后，你可以立即以反应进行一次武器攻击。</P>
