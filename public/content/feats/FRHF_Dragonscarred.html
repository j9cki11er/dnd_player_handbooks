<h2>龙之瘢 Dragonscarred</h2>
<P><b><FONT color=#800000>龙之瘢 
Dragonscarred</FONT> </b>
<BR><i>通用专长（先决：等级4+，新晋龙巫教徒专长）</i>
<BR>你获得以下增益。
</P>


<UL>
  <LI>
<DIV><b>属性值提升Ability Score Increase。</b>你的体质或魅力提升1，至多提升至20。
</DIV>
  </LI><LI>
<DIV><b>伤害抗性Damage Resistance。</b>当你获得此专长时，你自强酸、寒冷、火焰、闪电或毒素中选择一种。你获得你选择的伤害类型的抗性。
</DIV>
  </LI><LI>
<DIV><b>可怖伟力Fearsome Power。</b>当你在你的回合中以攻击动作或魔法动作对一名生物造成伤害时，你能够在本回合以附赠动作使用新晋龙巫教徒专长的龙之威增益。
</DIV></LI></UL>
