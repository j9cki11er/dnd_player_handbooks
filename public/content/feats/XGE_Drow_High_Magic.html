<h2>高等卓尔魔法 Drow High Magic</h2>
<P><STRONG><FONT color=#800000>高等卓尔魔法 Drow High 
Magic</FONT></STRONG><BR><EM>先决条件: 精灵（卓尔）</EM><BR>你学到了更多种类的黑暗精灵魔法。你习得并可以随意施展法术 <EM><FONT color=#800080>侦测魔法detect magic</FONT></EM> ，无需消耗法术位。同时，你习得法术 <EM><FONT color=#800080>浮空术levitate</FONT></EM> 与法术 <FONT color=#800080><EM>解除魔法dispel

，你可以不消耗法术位的施展这两个法术各一次。而你在完成一次长休后你重获以此免费施展这两个法术的使用次数。魅力是你施展这三个法术的施法属性。</P>
