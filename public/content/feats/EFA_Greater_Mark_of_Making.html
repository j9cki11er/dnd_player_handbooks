<h2>高等创造龙纹 Greater Mark of Making</h2>
<P><B><FONT color=#d08c36>高等创造龙纹 Greater Mark of 
Making</FONT></B>
<BR><i>通用专长（先决：等级4+，创造龙纹专长）</i>
<BR>你获得以下增益。
<BR><b>属性值提升Ability Score Increase。</b>你选择的一项属性提升1，至多提升至20。
<BR><b>直觉锐化Improved Intuition。</b>当你使用你创造龙纹的工匠直觉增益时，可以不再投掷1d4，改为投掷1d6。
<BR><b>鬼斧神造Improved 
Making。</b>当你使用你创造龙纹的法术匠人增益不消耗法术位地施展法术<U><EM>魔化武器Magic 
Weapon</EM></U> 时，你施展该法术的三环版本。</P>
