<h2>高等阴影龙纹 Greater Mark of Shadow</h2>
<P><B><FONT color=#d08c36>高等阴影龙纹 Greater Mark of 
Shadow</FONT></B>
<BR><i>通用专长（先决：等级4+，阴影龙纹专长）</i>
<BR>你获得以下增益。
<BR><b>属性值提升Ability Score Increase。</b>你选择的一项属性提升1，至多提升至20。
<BR><b>直觉锐化Improved Intuition。</b>当你使用你阴影龙纹的狡黠直觉增益时，可以不再投掷1d4，改为投掷1d6。
<BR><b>幽邃匿影Improved 
Shadow。</b>当你使用你阴影龙纹的阴影塑形增益不消耗法术位地施展法术<U><EM>隐形术Invisibility</EM></U>时，你施展该法术的三环版本。</P>
