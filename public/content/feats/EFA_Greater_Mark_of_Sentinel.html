<h2>高等哨戒龙纹 Greater Mark of Sentinel</h2>
<P><B><FONT color=#d08c36>高等哨戒龙纹 Greater Mark of 
Sentinel</FONT></B>
<BR><i>通用专长（先决：等级4+，哨戒龙纹专长）</i>
<BR>你获得以下增益。
<BR><b>属性值提升Ability Score Increase。</b>你选择的一项属性提升1，至多提升至20。
<BR><b>直觉锐化Improved Intuition。</b>当你使用你哨戒龙纹的哨戒直觉增益时，可以不再投掷1d4，改为投掷1d6。
<BR><b>枕戈待旦Improved 
Sentinel。</b>当你使用你哨戒龙纹的警戒哨卫增益时，作为该反应的一部分，你还能以武器或徒手打击发动一次攻击。</P>
