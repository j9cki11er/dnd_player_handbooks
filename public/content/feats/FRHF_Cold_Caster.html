<h2>寒地施法者 Cold Caster</h2>
<P><b><FONT color=#800000>寒地施法者 Cold 
Caster</FONT>  </b>
<BR><i>通用专长（先决：等级4+）</i>
<BR>你获得以下增益。
</P>


<UL>
  <LI>
<DIV><b>属性值提升Ability Score Increase。</b>你的智力、感知或魅力提升1，至多提升至20。
</DIV>
  </LI><LI>
<DIV><b>戏法Cantrip。</b>你习得戏法<b><color=#800080></b><U><EM>冷冻射线Ray of 
  Frost</EM></U>。若你已习得该戏法，你习得另一道你选择的法师戏法。该法术的施法属性是你以此专长提升的属性。
</DIV>
  </LI><LI>
<DIV><b>霜噬Frostbite。</b>每回合一次，当你以攻击检定命中一名生物并造成寒冷伤害时，你能够暂时削弱该生物的防御。在你的下个回合结束前，该生物进行的下次豁免检定减少1d4。
</DIV></LI></UL>
