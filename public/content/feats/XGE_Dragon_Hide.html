<h2>龙之鳞爪 Dragon Hide</h2>
<P><STRONG><FONT color=#800000>龙之鳞爪 Dragon 
Hide</FONT></STRONG><BR><EM>先决条件: 龙裔</EM><BR>你显出自你龙族先祖的利爪与鳞片，你获得下列增益：<BR> · 
你的力量、体质、或魅力+1，上限为20。<BR> · 
你的鳞片变得无比坚硬。如果你没穿着任何护甲，你的AC将变为13+你的敏捷调整值。你可以在装着盾牌时仍享受此增益。<BR> · 
你的指尖长出可伸缩的利爪，伸出或缩回爪子不消耗动作。这些爪子是可以用来发动徒手打击的天生武器，如果用他们击中了目标，将造成 1d4+你的力量调整值 
的挥砍伤害，而非正常徒手打击造成的钝击伤害。</P>
