<h2>巨灵魔法 Genie Magic</h2>
<P><b><FONT color=#800000>巨灵魔法 Genie 
Magic</FONT>  </b>
<BR><i>通用专长（先决：等级4+）</i>
<BR>你获得以下增益。
</P>


<UL>
  <LI>
<DIV><b>属性值提升Ability Score Increase。</b>你的智力、感知或魅力提升1，至多提升至20。
</DIV>
  </LI><LI>
<DIV><b>祈愿魔法Wish Magic。</b>你能够以魔法动作施展一道你从术士法术列表中选择的一环法术，该法术的施法时间需为动作。此增益一经使用，直至完成长休你都无法再次使用。该法术的施法属性是你以此专长提升的属性。
<BR>当你到达11级时，你以此专长施展的法术如同使用二环法术位施展。当你到达17级时，你以此专长施展的法术如同使用三环法术位施展。
</DIV></LI></UL>
