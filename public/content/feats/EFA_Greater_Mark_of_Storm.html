<h2>高等暴风龙纹 Greater Mark of Storm</h2>
<P><B><FONT color=#d08c36>高等暴风龙纹 Greater Mark of 
Storm</FONT></B>
<BR><i>通用专长（先决：等级4+，暴风龙纹专长）</i>
<BR>你获得以下增益。
<BR><b>属性值提升Ability Score Increase。</b>你选择的一项属性提升1，至多提升至20。
<BR><b>直觉锐化Improved Intuition。</b>当你使用你暴风龙纹的风骑直觉增益时，可以不再投掷1d4，改为投掷1d6。
<BR><b>长风化翼Improved 
Storm。</b>当你使用你暴风龙纹的暴风魔法增益不消耗法术位地施展法术<U><EM>造风术Gust of 
Wind</EM></U>   时，你在法术持续期间还会获得60尺飞行速度。</P>
