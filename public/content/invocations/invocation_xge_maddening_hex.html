<h2>癫狂巫咒 Maddening Hex</h2>
<p><EM>先决：第5级，习得法术<U><I>脆弱诅咒hex</I></U>、或具有可施加诅咒的魔契师特性</EM>
<BR>以一个附赠动作，你可以向着你的法术<U><EM>脆弱诅咒hex</EM></U>  或咒剑诅咒Hexblade's Curse 、凶兆符记Sign of Ill
Omen等魔契师特性所诅咒的目标施加一种精神干扰。此时，你对受咒目标与所有它周围5尺范围内的、由你所选择的生物造成一定心灵伤害，其伤害值等同于 你的魅力调整值
点（最低1点伤害）。使用此祈唤时，你必须能看到诅咒目标，且它与你之间的距离不能超过30尺。</p>
